[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leafroute"
version = "0.1.0"
description = "Compiled hierarchical retrieval runtime for fast, explainable, vectorless RAG"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "LeafRoute Contributors"}]
keywords = ["rag", "retrieval", "pageindex", "document-ai", "search", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "pymupdf>=1.24,<2",
  "rapidfuzz>=3.9,<4",
]

[project.optional-dependencies]
performance = ["zstandard>=0.22,<1", "blake3>=1,<2"]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
openai = ["openai>=1.40,<3"]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "httpx>=0.27,<1",
]
all = ["leafroute[api,openai,performance,dev]"]

[project.scripts]
leafroute = "leafroute.cli:app"

[tool.setuptools.packages.find]
include = ["leafroute*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true
